# Keeps the actions and the Go tools current. Actions are pinned to commit
# SHAs with the version in a comment; Dependabot bumps both.
#
# A week passes between a release and its bump: the window in which a
# compromised release is usually noticed and pulled. Security updates skip
# the cooldown and arrive at once, and govulncheck blocks CI meanwhile.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  # The client's own module has no dependencies; the tools module does.
  # Go records a `tool` directive's modules as `// indirect`, and Dependabot
  # updates only direct dependencies unless told otherwise
  # (dependabot/dependabot-core#12050).
  - package-ecosystem: gomod
    directory: /tools
    schedule:
      interval: monthly
    allow:
      - dependency-type: all
    cooldown:
      default-days: 7
    groups:
      go-tools:
        patterns: ["*"]
