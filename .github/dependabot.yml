# Keeps the actions and the Go tools current. Actions are pinned to commit
# SHAs with the version in a comment; Dependabot bumps both.
#
# A week passes between a release and its bump: the window in which a
# compromised release is usually noticed and pulled. Security updates skip
# the cooldown and arrive at once, and govulncheck blocks CI meanwhile.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  # The client's own module has no dependencies; the tools module does.
  # Only the tools are bumped, and `go get` raises their requirements to
  # what each release asks for: bumping a tool's dependencies past that can
  # break its build (yaml/v4 rc.6 does not compile with actionlint 1.7.12).
  # Go records a `tool` directive's module as `// indirect`, and an allow
  # rule's type defaults to direct, so each rule says `all`
  # (dependabot/dependabot-core#12050).
  - package-ecosystem: gomod
    directory: /tools
    schedule:
      interval: monthly
    allow:
      - dependency-name: github.com/rhysd/actionlint
        dependency-type: all
      - dependency-name: golang.org/x/perf
        dependency-type: all
      - dependency-name: golang.org/x/vuln
        dependency-type: all
    cooldown:
      default-days: 7
    groups:
      go-tools:
        patterns: ["*"]
