name: Release

# A v* tag reruns CI on the tagged commit, then hands the build to
# release-build.yml, which waits for a maintainer's approval.

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: ci
    uses: $/.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: release
    needs: ci
    uses: $/.github/workflows/release-build.yml
    permissions:
      contents: write # the draft release, its assets, and publishing it
      id-token: write # keyless signing and attestations
      attestations: write # provenance and SBOM attestations
