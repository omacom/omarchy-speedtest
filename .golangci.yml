version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - modernize
    - nolintlint
    - perfsprint
    - revive
    - thelper
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    errcheck:
      exclude-functions:
        # Output to the terminal or the panel: a closed stdout ends the
        # process with SIGPIPE, and there is nowhere to report to.
        - fmt.Fprintf
        - fmt.Fprintln
        # Response bodies are closed after they have been read in full.
        - (io.ReadCloser).Close
  exclusions:
    rules:
      # The stand-in server writes to clients that may already be gone, and
      # the process tests run the test binary itself.
      - path: _test\.go
        linters: [errcheck, gosec]

formatters:
  enable:
    - gofmt
