version: 2

project_name: omarchy-speedtest

# Reproducible: no cgo, no paths, commit-time timestamps. Rebuilding a tag
# with the same Go release gives byte-identical binaries and archives.
builds:
  - binary: omarchy-speedtest
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info:
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info:
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          mtime: "{{ .CommitDate }}"

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args: [sign-blob, "--bundle=${signature}", "${artifact}", --yes]
    artifacts: checksum

changelog:
  use: github
  # Name authors by GitHub handle only. The default falls back to name and
  # email when GitHub returns no login, as for a repository's first tag.
  format: "{{ .SHA }}: {{ .Message }}{{ if .Logins }} ({{ .Logins | englishJoin }}){{ end }}"
  abbrev: 7
  filters:
    exclude: ["^Merge "]

release:
  name_template: "omarchy-speedtest {{ .Version }}"
  # The release workflow attaches the attestations, then publishes.
  draft: true
  # Stop before building when the token cannot publish, or when this tag is
  # already an immutable release.
  preflight:
    fail_on_error: true
  footer: |
    ## Verify

    Every file in `checksums.txt` has a build provenance attestation, and each
    archive an SBOM attestation, from this repository's release workflow. They
    are also attached as `omarchy-speedtest_{{ .Version }}.intoto.jsonl`.

    ```sh
    gh attestation verify omarchy-speedtest_{{ .Version }}_linux_amd64.tar.gz --repo {{ .Env.GITHUB_REPOSITORY }} \
      --signer-workflow {{ .Env.GITHUB_REPOSITORY }}/.github/workflows/release-build.yml
    cosign verify-blob checksums.txt --bundle checksums.txt.sigstore.json \
      --certificate-identity "https://github.com/{{ .Env.GITHUB_REPOSITORY }}/.github/workflows/release.yml@refs/tags/{{ .Tag }}" \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com
    sha256sum --ignore-missing -c checksums.txt
    ```
